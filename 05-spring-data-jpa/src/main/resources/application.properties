spring.application.name=05-spring-data-jpa

# URL de conexão (troque "meu_projeto_db" pelo nome que você criou no pgAdmin)
spring.datasource.url=jdbc:postgresql://localhost:5432/meu_projeto_db

# Usuário padrão do Postgres e a senha que você cadastrou na instalação
spring.datasource.username=postgres
spring.datasource.password=c4899365

# Cria e atualiza as tabelas automaticamente baseadas nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Mostra no console do Java os comandos SQL que o Spring está executando
spring.jpa.show-sql=true