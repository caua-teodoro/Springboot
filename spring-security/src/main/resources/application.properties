# Nome lógico da aplicação exibido nos logs de inicialização do Spring Boot
spring.application.name=spring-security

# URL de conexão JDBC apontando para o servidor PostgreSQL local (porta 5432) e banco "meu_projeto_db"
# (troque "meu_projeto_db" pelo nome que você criou no pgAdmin)
spring.datasource.url=jdbc:postgresql://localhost:5432/meu_projeto_db

# Usuário padrão do Postgres e a senha que você cadastrou na instalação
spring.datasource.username=postgres
spring.datasource.password=c4899365

# Cria e atualiza as tabelas automaticamente baseadas nas suas classes @Entity (ex.: tab_user_security e tab_user_roles)
# Em produção costuma-se usar "validate" ou "none" junto com ferramentas de migration (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update

# Mostra no console do Java os comandos SQL que o Spring/Hibernate está executando no banco
spring.jpa.show-sql=true

# Securyty - simples (Etapa 1 de estudo: usuário único fixo via properties)
# Mantido comentado porque agora a autenticação vem do banco de dados via SecurityDatabaseService (UserDetailsService)
